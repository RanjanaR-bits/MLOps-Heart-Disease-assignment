apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-risk-api
  labels:
    app: heart-risk-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-risk-api
  template:
    metadata:
      labels:
        app: heart-risk-api
    spec:
      containers:
        - name: api
          image: heart-risk-api:1.0
          imagePullPolicy: IfNotPresent   # image is built locally / loaded into minikube
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_VERSION
              value: "1.0"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
